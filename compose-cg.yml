version: '3.8'

services:
  db:
    image: cgr.dev/samcorp/postgres:17@sha256:5ba00ad1ce1240d6c658cc5a26793a9f74eb3c0dd24edea3fc22e2f6abfd803e
    environment:
      POSTGRES_DB: todoapp
      POSTGRES_USER: todouser
      POSTGRES_PASSWORD: todopass
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U todouser -d todoapp"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend-cg:
    build:
      context: ./backend
      dockerfile: Dockerfile.converted
      secrets:
        - netrc
    ports:
      - "5000:5000"
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://todouser:todopass@db:5432/todoapp
    volumes:
      - ./backend:/app

  frontend-cg:
    build:
      context: ./frontend
      dockerfile: Dockerfile.converted
    ports:
      - "3000:8080"
    depends_on:
      - backend-cg

volumes:
  postgres_data:

secrets:
  netrc:
    file: .netrc