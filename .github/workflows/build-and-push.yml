name: Build and deploy images

on:
  workflow_call:
    secrets:
      CHAINCTL_IDENTITY:
        required: true
    inputs:
      IMAGE_TAG:
        required: true
        type: string

permissions:
  contents: read
  id-token: write

env:
  NAMESPACE: cupofpython
  CG_FRONTEND_IMAGE_NAME: cg-e2e-frontend
  CG_BACKEND_IMAGE_NAME: cg-e2e-backend
  FRONTEND_IMAGE_NAME: e2e-frontend
  BACKEND_IMAGE_NAME: e2e-backend

jobs:
  integrity-check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4
      - name: Setup chainctl
        uses: chainguard-dev/setup-chainctl@v0.5.0
        with:
          identity: ${{ secrets.CHAINCTL_IDENTITY }}
      - name: Verify base image for frontend (Chainguard)
        uses: cupofpython/integrity-check@v1.1.1
        with:
          dockerfile: frontend/Dockerfile.converted
      - name: Verify base image for backend (Chainguard)
        uses: cupofpython/integrity-check@v1.1.1
        with:
          dockerfile: backend/Dockerfile.converted
  build-and-push-image:
    needs: integrity-check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: 'Login to GitHub Container Registry'
        uses: docker/login-action@v1
        with:
          registry: ghcr.io
          username: ${{github.actor}}
          password: ${{secrets.GITHUB_TOKEN}}

      - name: Setup chainctl
        uses: chainguard-dev/setup-chainctl@v0.5.0
        with:
          identity: ${{ secrets.CHAINCTL_IDENTITY }}

      - name: Build and push frontend (DH)
        run: |
          docker build frontend -t ghcr.io/${{ env.NAMESPACE }}/${{ env.FRONTEND_IMAGE_NAME }}:${{ inputs.IMAGE_TAG }}
          docker push ghcr.io/${{ env.NAMESPACE }}/${{ env.FRONTEND_IMAGE_NAME }}:${{ inputs.IMAGE_TAG }}

      - name: Build and push frontend (CG)
        run: |
          docker build frontend -f frontend/Dockerfile.converted -t ghcr.io/${{ env.NAMESPACE }}/${{ env.CG_FRONTEND_IMAGE_NAME }}:${{ inputs.IMAGE_TAG }}
          docker push ghcr.io/${{ env.NAMESPACE }}/${{ env.CG_FRONTEND_IMAGE_NAME }}:${{ inputs.IMAGE_TAG }}

      - name: Build and push backend (DH)
        run: |
          docker build backend -t ghcr.io/${{ env.NAMESPACE }}/${{ env.BACKEND_IMAGE_NAME }}:${{ inputs.IMAGE_TAG }}
          docker push ghcr.io/${{ env.NAMESPACE }}/${{ env.BACKEND_IMAGE_NAME }}:${{ inputs.IMAGE_TAG }}

      - name: Generate .netrc
        run: |
          echo "machine libraries.cgr.dev login ${{ secrets.CGR_USERNAME }} password ${{ secrets.CGR_PASSWORD }}" > /tmp/.netrc

      - name: Build and push backend (CG)
        run: |
          DOCKER_BUILDKIT=1 docker build \
            --secret id=netrc,src=/tmp/.netrc \
            -f backend/Dockerfile.converted \
            -t ghcr.io/${{ env.NAMESPACE }}/${{ env.CG_BACKEND_IMAGE_NAME }}:${{ inputs.IMAGE_TAG }} \
            backend/
          docker push ghcr.io/${{ env.NAMESPACE }}/${{ env.CG_BACKEND_IMAGE_NAME }}:${{ inputs.IMAGE_TAG }}

      - name: Cleanup .netrc
        if: always()
        run: rm -f /tmp/.netrc
