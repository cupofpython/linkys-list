name: Build and deploy images

on:
  workflow_call:
    secrets:
      DOCKERHUB_TOKEN:
        required: true
    inputs:
      IMAGE_TAG:
        required: true
        type: string

permissions:
  contents: read
  id-token: write

env:
  REGISTRY: sammorriscg
  FRONTEND_IMAGE_NAME: cg-e2e-frontend
  BACKEND_IMAGE_NAME: cg-e2e-backend
  USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
  PASSWORD: ${{ secrets.DOCKERHUB_TOKEN }}

jobs:
  integrity-check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4
      - name: Setup chainctl
        uses: chainguard-dev/setup-chainctl@v0.5.0
        with:
          identity: ${{ secrets.CHAINCTL_IDENTITY }}
      - name: Verify base image for frontend (Chainguard)
        uses: cupofpython/integrity-check@v1
        with:
          dockerfile: frontend/Dockerfile.converted
      - name: Verify base image for backend (Chainguard)
        uses: cupofpython/integrity-check@v1
        with:
          dockerfile: backend/Dockerfile.converted
  build-and-push-image:
    needs: integrity-check
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3.4.0
        with:
          username: ${{ env.USERNAME }}
          password: ${{ env.PASSWORD }}

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          push: true
          file: frontend/Dockerfile
          context: frontend
          tags: ${{ env.REGISTRY }}/${{ env.FRONTEND_IMAGE_NAME }}:${{ inputs.IMAGE_TAG }}

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          push: true
          file: backend/Dockerfile
          context: backend
          tags: ${{ env.REGISTRY }}/${{ env.BACKEND_IMAGE_NAME }}:${{ inputs.IMAGE_TAG }}
        
        
    
    
